<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>机械设备监控看板</title>
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

  <!-- ========== HEADER ========== -->
  <header>
    <h1 class="title">机械设备监控看板</h1>
    <div class="header-right">
      <div class="datetime">
        <span class="date" id="date-text">----/--/--</span>
        <span class="time" id="time-text">--:--:--</span>
      </div>
      <span class="conn-status" id="conn-status">未连接</span>
    </div>
  </header>

  <!-- ========== MAIN ========== -->
  <main>
    <!-- 左侧：场桥 -->
    <section class="panel panel-left">
      <div class="panel-header">
        <span class="panel-title">场桥信息</span>
        <span>当前在线 <span class="panel-count" id="rtg-count">0</span></span>
      </div>
      <div class="card-list" id="rtg-cards">
        <div class="card-placeholder">等待数据...</div>
      </div>
    </section>

    <!-- 中间：船舶信息、图表 -->
    <section class="center-col">
      <div class="ship-panel" id="ship-info">
        <span class="ship-placeholder">等待数据...</span>
      </div>
      <!-- 详情区 -->
      <div id="detail-panel" class="panel detail-panel">
        <div class="detail-slot detail-ship" id="ship-detail">
          <div class="detail-head sd-head">
            <span class="sd-title">
              <span class="sd-ship" id="sd-ship"></span>
              <span class="sd-voyage" id="sd-voyage"></span>
            </span>
            <div class="sd-progress">
              <div class="sd-progress-line">
                <span class="sd-progress-num" id="sd-progress-num">--</span>
                <span class="sd-progress-pct" id="sd-progress-pct"></span>
              </div>
              <div class="bar"><div class="bar-fill bar-total" id="sd-progress-bar"></div></div>
            </div>
            <span class="sd-ref">
              <label for="sd-duration">预计作业时长 (h)</label>
              <input type="number" id="sd-duration" min="0.5" step="0.5">
              <label for="sd-endtime">预计完工时间</label>
              <input type="datetime-local" id="sd-endtime">
            </span>
            <button id="sd-close" class="sd-close" type="button">×</button>
          </div>
          <div class="sd-chart-wrap"><canvas id="sd-chart"></canvas></div>
        </div>

        <div class="detail-slot detail-qc hidden" id="qc-detail">
          <div class="detail-head qd-head">
            <span class="sd-title" id="qd-title">岸桥作业</span>
          </div>
          <div class="qd-body">
            <div class="qd-legend">
              <span class="qd-legend-label">0</span>
              <span class="qd-legend-bar" id="qd-legend-bar"></span>
              <span class="qd-legend-label" id="qd-legend-max">30+</span>
            </div>
            <div class="qd-heat-wrap"><canvas id="qd-chart"></canvas></div>
            <div class="qd-empty hidden" id="qd-empty">该船暂无岸桥作业</div>
          </div>
        </div>
      </div>
      <!-- 作业量统计图表 -->
      <div class="panel chart-panel">
        <div class="chart-area">
          <div class="chart-header">
            <span class="chart-title"><span class="ct-mode">当班</span>场桥作业量</span>
            <span class="chart-summary" id="summary-rtg"></span>
          </div>
          <div class="chart-body">        
            <canvas id="chart-rtg"></canvas>
          </div>
        </div>
        <div class="chart-divider"></div>
        <div class="chart-row">
          <div class="chart-area">
            <div class="chart-header">
              <span class="chart-title"><span class="ct-mode">当班</span>岸桥作业量</span>
              <span class="chart-summary" id="summary-qc"></span>
            </div>
            <div class="chart-body">        
              <canvas id="chart-qc"></canvas>
            </div>
          </div>
          <div class="chart-v-divider"></div>
          <div class="chart-area">
            <div class="chart-header">
              <span class="chart-title"><span class="ct-mode">当班</span>堆高机作业量</span>
              <span class="chart-summary" id="summary-fl"></span>
            </div>
            <div class="chart-body">        
              <canvas id="chart-fl"></canvas>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- 右侧：岸桥 + 堆高机 -->
    <section class="panel panel-right">
      <div class="right-section right-top">
        <div class="panel-header">
          <span class="panel-title">岸桥信息</span>
          <span>当前在线 <span class="panel-count" id="qc-count">0</span></span>
        </div>
        <div class="card-list" id="qc-cards">
          <div class="card-placeholder">等待数据...</div>
        </div>
      </div>
      <div class="right-section right-bottom">
        <div class="panel-header">
          <span class="panel-title">堆高机信息</span>
          <span>当前在线 <span class="panel-count" id="fl-count">0</span></span>
        </div>
        <div class="card-list" id="fl-cards">
          <div class="card-placeholder">等待数据...</div>
        </div>
      </div>
    </section>
  </main>

  <!-- ========== SCRIPTS ========== -->
  <script src="libs/chart.umd.min.js"></script>
  <script src="libs/chartjs-chart-matrix.min.js"></script>
  <script src="libs/chartjs-plugin-datalabels.min.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
