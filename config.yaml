# ===========================================================
# MQTT 连接配置
# ===========================================================
mqtt:
  host: "192.168.100.6"
  port: 1883
  client_id: "dashboard_client_01"
  username: ${MQTT_USERNAME}
  password: ${MQTT_PASSWORD}
  topic: "initLocation"
  qos: 1

# ===========================================================
# 消息处理配置
# ===========================================================
message:
  expire_interval: 30  # 消息过期时间（秒）

# ===========================================================
# 状态检测配置
# ===========================================================
detector:
  transfer_threshold: 10000   # 转场阈值（毫秒）
  move_threshold: 2500        # 贝间移动阈值（毫秒）
  offline_threshold: 5        # 离线阈值（秒）
  transfer_bays:
    - "001"
    - "071"
    - "069"

# ===========================================================
# SSE 服务配置
# ===========================================================
sse:
  host: "0.0.0.0"
  port: 8765
  max_clients: 20

# ===========================================================
# HTTP 鉴权（Basic Auth）
# ===========================================================
auth:
  enabled: true
  username: ${DASHBOARD_USERNAME}
  password: ${DASHBOARD_PASSWORD}

# ===========================================================
# Oracle 数据库配置
# ===========================================================
oracle:
  host: "192.168.100.110"
  port: 1521
  service_name: "orcl"
  user: ${ORACLE_USER}
  password: ${ORACLE_PASSWORD}
  lib_dir: ${ORACLE_LIB_DIR}

# ===========================================================
# 定时调度配置
# ===========================================================
scheduler:
  delay: 2                    # 启动延迟（分钟）
  intervals:                  # 执行间隔（分钟）
    info:   10
    stats:  30
  stats_mode: "shift"         # 作业统计模式: "day"=当日(零点起) / "shift"=当班(换班起点)
  shift:                      # 当班统计：换班检测（stats_mode="shift" 时生效）
    check_time: "07:30"       # 当班起点 / 换班检测点（HH:MM）；每日检测在 check_time + scheduler.delay 后执行
    window_minutes: 30        # 检测窗口 = 交接带 [check_time-window_minutes, check_time)；默认 7:00-7:30
  test:
    enabled: false
    test_datetime: "2024-07-29 23:30:00"

# ===========================================================
# 日志配置
# ===========================================================
logging:
  level: "INFO"
  file: "logs/app.log"
  rotation:
    max_bytes: 5242880    # 5MB
    backup_count: 10
