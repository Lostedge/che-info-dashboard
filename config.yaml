# ===========================================================
# MQTT 连接配置
# ===========================================================
mqtt:
  host: "192.168.100.6"
  port: 1883
  client_id: "dashboard_client_01"
  username: ${MQTT_USERNAME}
  password: ${MQTT_PASSWORD}
  topic: "initLocation"
  qos: 1

# ===========================================================
# 消息处理配置
# ===========================================================
message:
  expire_interval: 30  # 消息过期时间（秒）

# ===========================================================
# 状态检测配置
# ===========================================================
detector:
  transfer_threshold: 10000   # 转场阈值（毫秒）
  move_threshold: 2500        # 贝间移动阈值（毫秒）
  offline_threshold: 5        # 离线阈值（秒）
  transfer_bays:
    - "001"
    - "071"
    - "069"

# ===========================================================
# SSE 服务配置
# ===========================================================
sse:
  host: "0.0.0.0"
  port: 8765

# ===========================================================
# Oracle 数据库配置
# ===========================================================
oracle:
  host: "192.168.100.110"
  port: 1521
  service_name: "orcl"
  user: ${ORACLE_USER}
  password: ${ORACLE_PASSWORD}
  lib_dir: ${ORACLE_LIB_DIR}

# ===========================================================
# 定时调度配置
# ===========================================================
scheduler:
  interval: 30    # 执行间隔（分钟）
  delay: 2        # 启动延迟（分钟）

# ===========================================================
# 日志配置
# ===========================================================
logging:
  level: "INFO"
  file: "logs/app.log"
  rotation:
    max_bytes: 5242880    # 5MB
    backup_count: 10
